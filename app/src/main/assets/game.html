/* ---------- লেআউট ---------- */
const CX = 540, CY = 980, RR = 485;        // arena-র কেন্দ্র ও ব্যাসার্ধ (ভার্চুয়াল পিক্সেল)
const WR = 500;                            // ফিজিক্স জগতের ব্যাসার্ধ
const S = RR / WR;
const GRID_COLS = 26, GRID_LEFT = 60, GRID_W = 960, GRID_BOTTOM = 1800;

/* ---------- পতাকার ছবি ---------- */
const flagImgs = {};
function flagImg(code){
  let im = flagImgs[code];
  if (!im) { im = new Image(); if (FLAGS[code]) im.src = FLAGS[code]; flagImgs[code] = im; }
  return im;
}
const ready = im => im && im.complete && im.naturalWidth > 0;
/* wBase = আদর্শ (3:2) পতাকার প্রস্থ। অন্য অনুপাতের পতাকা সমান ক্ষেত্রফলে বসে। কোনো ঢেউ/বাঁকা নেই। */
function flagSize(im, wBase){
  const ratio = im.naturalHeight / im.naturalWidth;
  const w = wBase * Math.sqrt((2 / 3) / ratio);
  return [w, w * ratio];
}
function drawFlag(code, x, y, wBase, alpha, rot, shadow){
  const im = flagImg(code); if (!ready(im)) return;
  const [w, h] = flagSize(im, wBase);
  ctx.save();
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.translate(x, y); if (rot) ctx.rotate(rot);
  if (shadow) { ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = shadow; ctx.shadowOffsetY = shadow * 0.25; }
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  ctx.strokeStyle = 'rgba(0,0,0,0.38)'; ctx.lineWidth = Math.max(0.8, w * 0.03); ctx.strokeRect(-w / 2, -h / 2, w, h);
  ctx.restore();
}
/* নির্দিষ্ট উচ্চতায় (তালিকার জন্য) */
function drawFlagH(code, x, y, hh, maxW){
  const im = flagImg(code); if (!ready(im)) return 0;
  let h = hh, w = h * im.naturalWidth / im.naturalHeight;
  if (maxW && w > maxW) { w = maxW; h = w * im.naturalHeight / im.naturalWidth; }
  ctx.drawImage(im, x - w / 2, y - h / 2, w, h);
  return w;
}

/* ---------- গেম স্টেট ---------- */
let balls = [], elim = [], gaps = [], qualified = [];
let phase = 'play', t = 0, clock = 0, ringAngle = 0, ballR = 15, total = 0;
let preT = 0, preIdx = 0, accT = 0, prevRing = 0, renderAlpha = 1;
const STEP = 1 / 120;       // স্থির ফিজিক্স ধাপ; আঁকার সময় মাঝের অবস্থান বের করা হয় → ৬০fps-এ মসৃণ
let roundNo = 0, finalMode = false, winner = null, overlayT = 0, lastFallen = null;
const E_BALL = 0.96, E_WALL = 1.0;

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const normAngle = a => ((a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;

/* ---------- বাদ-পড়া পতাকার পথ: ফাঁক দিয়ে বেরিয়ে সার্কেলের বাইরে দিয়ে ঘুরে নিচে যাবে ---------- */
function gridPos(i){
  const cell = GRID_W / GRID_COLS, pitch = 27;
  const row = Math.floor(i / GRID_COLS), col = i % GRID_COLS;
  return [GRID_LEFT + col * cell + cell / 2, GRID_BOTTOM - row * pitch - pitch / 2];
}
function buildElimPath(x0, y0, tx, ty){
  const Rout = RR + 34, ang = Math.atan2(y0 - CY, x0 - CX);
  const side = Math.cos(ang) >= 0 ? 1 : -1;
  const tgt = side > 0 ? 0.3 : Math.PI - 0.3;           // সার্কেলের পাশের নিচের দিকের বিন্দু
  const da = normAngle(tgt - ang);
  let pts = [[x0, y0], [CX + Math.cos(ang) * (RR + 14), CY + Math.sin(ang) * (RR + 14)]];
  const steps = Math.max(2, Math.ceil(Math.abs(da) / 0.1));
  for (let i = 0; i <= steps; i++) {
    const a = ang + da * i / steps;
    pts.push([CX + Math.cos(a) * Rout, CY + Math.sin(a) * Rout]);
  }
  const sx = CX + Math.cos(tgt) * Rout;
  pts.push([sx, 1545], [tx, ty]);
  for (let pass = 0; pass < 2; pass++) {                 // কোণ মসৃণ করা (Chaikin)
    const np = [pts[0]];
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      np.push([a[0] * 0.75 + b[0] * 0.25, a[1] * 0.75 + b[1] * 0.25], [a[0] * 0.25 + b[0] * 0.75, a[1] * 0.25 + b[1] * 0.75]);
    }
    np.push(pts[pts.length - 1]); pts = np;
  }
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  return { pts, cum, L: cum[cum.length - 1] };
}
function pathAt(path, d){
  const { pts, cum } = path;
  if (d <= 0) return pts[0];
  if (d >= path.L) return pts[pts.length - 1];
  let lo = 0, hi = cum.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (cum[m] <= d) lo = m; else hi = m; }
  const f = (d - cum[lo]) / (cum[hi] - cum[lo] || 1);
  return [pts[lo][0] + (pts[hi][0] - pts[lo][0]) * f, pts[lo][1] + (pts[hi][1] - pts[lo][1]) * f];
}

function startRound(){
  roundNo++;
  finalMode = qualified.length >= CONFIG.finalists;
  let list = finalMode ? qualified.slice() : ALL_CODES.filter(c => qualified.indexOf(c) < 0);
  shuffle(list);
  if (!finalMode && CONFIG.maxFlags > 0) list.length = Math.min(list.length, CONFIG.maxFlags);
  total = list.length;

  ballR = Math.min(WR * Math.sqrt(0.36 / total), WR * 0.12);
  let pts = [];
  for (let tries = 0; tries < 40; tries++) {
    pts = [];
    const sp = ballR * 2.15, dy = sp * 0.866;
    let row = 0;
    for (let y = -WR * 0.92; y < WR * 0.92; y += dy, row++) {
      for (let x = -WR * 0.92 + (row % 2) * sp / 2; x < WR * 0.92; x += sp) {
        if (Math.hypot(x, y) < WR - ballR * 1.4) pts.push([x, y]);
      }
    }
    if (pts.length >= total) break;
    ballR *= 0.94;
  }
  shuffle(pts);
  balls = list.map((code, i) => {
    const a = Math.random() * Math.PI * 2, sp = CONFIG.minSpeed * (1 + Math.random() * 1.2);
    return { code, x: pts[i][0], y: pts[i][1], px: pts[i][0], py: pts[i][1], vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: ballR };
  });
  elim = []; winner = null; lastFallen = null;
  t = 0; phase = 'intro'; preT = 0; preIdx = 0; ringAngle = Math.random() * Math.PI * 2; prevRing = ringAngle; accT = 0;

  const order = [0, 4, 2, 6, 1, 5, 3, 7];
  const off = Math.random() * Math.PI * 2;
  gaps = [];
  for (let k = 0; k < CONFIG.maxGaps; k++) {
    gaps.push({
      c: off + (order[k % 8] / 8) * Math.PI * 2,
      openAt: CONFIG.introSec + CONFIG.holesStartSec + k * CONFIG.gapIntervalSec
    });
  }
  list.forEach(c => flagImg(c));
}

function gapWidth(g){
  if (t < g.openAt) return 0;
  const late = Math.max(0, t - (CONFIG.introSec + CONFIG.holesStartSec + 70)) * 0.004;
  const maxW = Math.max(CONFIG.gapMaxWidth, 4.8 * ballR / WR) + late;
  return Math.min(maxW, (t - g.openAt) * 0.33);
}
function inGap(angleWorld, margin){
  const rel0 = angleWorld - ringAngle;
  for (const g of gaps) {
    const w = gapWidth(g);
    if (w <= 0) continue;
    if (Math.abs(normAngle(rel0 - g.c)) < w / 2 - margin) return true;
  }
  return false;
}

/* ---------- ভয়েস: আমেরিকান ইংলিশ, তরুণী (~২৫ বছর) – ব্রাউজারের নিজস্ব Text-to-Speech ---------- */
let usVoice = null;
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices(); if (!vs.length) return;
  const us = vs.filter(v => /en[-_]US/i.test(v.lang));
  const fem = /(Samantha|Zira|Aria|Jenny|Michelle|Ava|Allison|Susan|Joanna|Salli|Kendra|Kimberly|Ivy|Emma|Google US English|Female|Nicky|Sara)/i;
  usVoice = us.find(v => fem.test(v.name)) || us[0] || vs.find(v => /^en/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
const _utts = [];                       // utterance GC হয়ে ভয়েস থেমে যাওয়া আটকাতে ধরে রাখি
function say(text, queue){
  if (!CONFIG.voice || muted || !('speechSynthesis' in window)) return;
  try {
    if (!usVoice) pickVoice();
    const ss = speechSynthesis;
    if (!queue && (ss.speaking || ss.pending)) ss.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; if (usVoice) u.voice = usVoice;
    u.pitch = 1.2; u.rate = 1.0; u.volume = 1;      // pitch একটু বেশি = তরুণী কণ্ঠ
    _utts.push(u);
    u.onend = u.onerror = () => { const k = _utts.indexOf(u); if (k >= 0) _utts.splice(k, 1); };
    setTimeout(() => { try { ss.resume(); ss.speak(u); } catch (e) {} }, queue ? 0 : 70);   // cancel-এর ঠিক পরেই speak করলে Chrome গিলে ফেলে
  } catch (e) {}
}
let speechUnlocked = false;
function unlockSpeech(){                // প্রথম ট্যাপে ভয়েস "আনলক" (ফোন/Safari-র জন্য জরুরি)
  if (speechUnlocked || !('speechSynthesis' in window)) return;
  speechUnlocked = true;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}

/* ---------- সাউন্ড: ধাক্কা লাগলে বুদবুদের শব্দ (Web Audio, কোনো ফাইল লাগে না) ---------- */
let AC = null, masterG = null, muted = false, voices = 0;
const lastSnd = { ball: 0, wall: 0 };
function initAudio(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterG = AC.createGain(); masterG.gain.value = 0.95;
    const comp = AC.createDynamicsCompressor();
    masterG.connect(comp); comp.connect(AC.destination);
  } catch (e) { AC = null; }
}
['pointerdown', 'touchstart', 'click', 'keydown'].forEach(ev => window.addEventListener(ev, () => { initAudio(); unlockSpeech(); }, { passive: true }));
initAudio();      // OBS/ব্রাউজার সোর্সে ট্যাপ ছাড়াই চালু হয়ে যায়
function bubble(kind, power){
  if (!AC || muted || AC.state !== 'running' || voices >= 14) return;
  const now = AC.currentTime, wall = kind === 'wall';
  if (now - lastSnd[kind] < (wall ? 0.05 : 0.045)) return;
  lastSnd[kind] = now;
  const v = Math.min(1, power / 500);
  const f0 = wall ? 240 + Math.random() * 110 : 480 + Math.random() * 420;   // দেয়ালে একটু ভারী "বুম্ব", পতাকায় হালকা "বুপ"
  const f1 = f0 * (1.8 + Math.random() * 0.5), dur = wall ? 0.17 : 0.11;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(f0, now);
  o.frequency.exponentialRampToValueAtTime(f1, now + dur * 0.7);
  const peak = (wall ? 0.55 : 0.38) * (0.55 + 0.45 * v);
  g.gain.setValueAtTime(0.0001, now);
  g.gain.linearRampToValueAtTime(peak, now + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o.connect(g); g.connect(masterG);
  voices++; o.onended = () => { voices--; };
  o.start(now); o.stop(now + dur + 0.03);
}

/* ---------- ফিজিক্স ---------- */
function step(dt){
  t += dt;
  const omega = CONFIG.rotationSpeed * (1 + 0.25 * Math.sin(t * 0.45));
  ringAngle += omega * dt;
  const n = balls.length;

  for (const b of balls) {
    b.x += b.vx * dt; b.y += b.vy * dt;
    { const dd = Math.hypot(b.x, b.y);
      if (dd > WR * 0.78) { const f = (dd / WR - 0.78) / 0.22 * 340 * dt; b.vx -= b.x / dd * f; b.vy -= b.y / dd * f; } }
    const sp = Math.hypot(b.vx, b.vy);
    if (sp > CONFIG.maxSpeed) { b.vx *= CONFIG.maxSpeed / sp; b.vy *= CONFIG.maxSpeed / sp; }
    else if (sp < CONFIG.minSpeed) {
      const k = sp < 1 ? 0 : Math.min(CONFIG.minSpeed / sp, 1 + 4 * dt);
      if (k === 0) { const a = Math.random() * 6.283; b.vx = Math.cos(a) * CONFIG.minSpeed; b.vy = Math.sin(a) * CONFIG.minSpeed; }
      else { b.vx *= k; b.vy *= k; }
    }
  }

  const min = ballR * 2, min2 = min * min;
  for (let it = 0; it < 2; it++) {
    for (let i = 0; i < n; i++) {
      const a = balls[i];
      for (let j = i + 1; j < n; j++) {
        const c = balls[j];
        const dx = c.x - a.x; if (dx > min || dx < -min) continue;
        const dy = c.y - a.y; if (dy > min || dy < -min) continue;
        const d2 = dx * dx + dy * dy;
        if (d2 >= min2 || d2 < 1e-6) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, ov = (min - d) / 2;
        a.x -= nx * ov; a.y -= ny * ov; c.x += nx * ov; c.y += ny * ov;
        const vn = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
        if (vn < 0) {
          if (it === 0 && vn < -40) bubble('ball', -vn);
          const imp = -(1 + E_BALL) * vn / 2;
          a.vx -= imp * nx; a.vy -= imp * ny; c.vx += imp * nx; c.vy += imp * ny;
        }
      }
    }
  }

  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    const d = Math.hypot(b.x, b.y);
    if (d + b.r <= WR) continue;
    const ang = Math.atan2(b.y, b.x);
    if (inGap(ang, (b.r / WR) * 0.9)) {
      if (d > WR + b.r * 0.6 + 4) {        // ফাঁক দিয়ে বেরিয়ে গেছে → নিচের সারিতে যাবে
        balls.splice(i, 1);
        const ex = CX + b.x * S, ey = CY + b.y * S, gp = gridPos(elim.length), path = buildElimPath(ex, ey, gp[0], gp[1]);
        elim.push({ code: b.code, t0: clock, x0: ex, y0: ey, w0: b.r * S * 2.0, rot: (Math.random() - 0.5) * 1.2, path, dur: Math.max(1.0, Math.min(2.4, path.L / 1000)) });
        lastFallen = b;
      }
      continue;
    }
    const nx = b.x / d, ny = b.y / d, pen = d + b.r - WR;
    b.x -= nx * pen; b.y -= ny * pen;
    const vn = b.vx * nx + b.vy * ny;
    if (vn > 0) { if (vn > 60) bubble('wall', vn); b.vx -= (1 + E_WALL) * vn * nx; b.vy -= (1 + E_WALL) * vn * ny; }
    // দেয়ালে ধাক্কার পর পতাকা যেন কিনারা ঘেঁষে না ঘোরে: ভেতরের দিকে ফেরত পাঠাই (কোণ সর্বোচ্চ ~50° + সামান্য এলোমেলো)
    {
      const sp2 = Math.hypot(b.vx, b.vy) || 1;
      const vin = -(b.vx * nx + b.vy * ny);                 // ভেতরের দিকের গতি
      let tvx = b.vx + vin * nx, tvy = b.vy + vin * ny;     // স্পর্শক-গতি
      const tl = Math.hypot(tvx, tvy) || 1e-6;
      const minIn = 0.64 + Math.random() * 0.3;             // কমপক্ষে এতটা অংশ ভেতরের দিকে
      if (vin < sp2 * minIn) {
        const inn = sp2 * minIn, tan = Math.sqrt(Math.max(0, sp2 * sp2 - inn * inn));
        b.vx = -nx * inn + (tvx / tl) * tan * (Math.random() < 0.15 ? -1 : 1);
        b.vy = -ny * inn + (tvy / tl) * tan * (Math.random() < 0.15 ? -1 : 1);
      }
    }
  }
}

function endRound(){
  winner = balls[0] ? balls[0].code : (lastFallen && lastFallen.code);
  overlayT = 0;
  if (!winner) { startRound(); return; }
  say('The winner is ' + englishName(winner), true);
  if (finalMode) {
    wins[winner] = (wins[winner] || 0) + 1; saveWins();
    phase = 'champion';
  } else {
    qualified.push(winner);
    phase = 'qualified';
  }
}

function update(dt){
  dt *= CONFIG.speed;
  clock += dt; renderAlpha = 1;
  if (phase === 'play') {
    accT += dt;
    while (accT >= STEP) {
      for (const b of balls) { b.px = b.x; b.py = b.y; }
      prevRing = ringAngle; step(STEP); accT -= STEP;
      if (balls.length <= 1) break;
    }
    renderAlpha = accT / STEP;
    if (balls.length <= 1) endRound();
  } else if (phase === 'intro') {
    preT += dt; ringAngle += CONFIG.rotationSpeed * dt;
    const ev = [[0, finalMode ? 'Final round' : 'Round ' + roundNo], [1.8, 'Get ready'], [3, 'Three'], [4, 'Two'], [5, 'One']];
    while (preIdx < ev.length && preT >= ev[preIdx][0]) { say(ev[preIdx][1], preIdx === 0); preIdx++; }
    if (preT >= CONFIG.preRoundSec) { phase = 'play'; t = 0; }
  } else {
    overlayT += dt;
    ringAngle += CONFIG.rotationSpeed * dt;
    if (phase === 'qualified' && overlayT > CONFIG.qualifiedShowSec) startRound();
    if (phase === 'champion' && overlayT > CONFIG.championShowSec) { qualified = []; roundNo = 0; startRound(); }
  }
}

/* ---------- আঁকার সাহায্যকারী ---------- */
const FONT = '"Segoe UI","Noto Sans Bengali","Noto Sans",Arial,sans-serif';
function rr(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function txt(s, x, y, size, color, align, weight, stroke){
  ctx.font = (weight || 'bold') + ' ' + size + 'px ' + FONT;
  ctx.textAlign = align || 'center'; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = Math.max(2, size * 0.12); ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color || '#fff'; ctx.fillText(s, x, y);
}
const TIMER_START = Date.now();
function hms(sec){ sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), x = sec % 60; return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); }
function countdown(){          // রাউন্ড/কোয়ালিফাই যাই হোক, নিজের মতো কমে; ০ হলে আবার শুরু
  const T = CONFIG.timerSec || 3600, el = (Date.now() - TIMER_START) / 1000 % T;
  return hms(Math.ceil(T - el));
}
const mmss = sec => { sec = Math.max(0, Math.floor(sec)); return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); };
function clockIcon(x, y, r, color){
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x, y + 2, r, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y + 2); ctx.lineTo(x, y - r * 0.5 + 2); ctx.moveTo(x, y + 2); ctx.lineTo(x + r * 0.45, y + 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 4, y - r - 3); ctx.lineTo(x + 4, y - r - 3); ctx.stroke();
  ctx.restore();
}

/* ---------- আঁকা ---------- */
function draw(){
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  const k = Math.min(CW / VW, CH / VH) * DPR, ox = (canvas.width - VW * k) / 2, oy = (canvas.height - VH * k) / 2;
  if (bgDirty || !bgCanvas) {            // স্থির ব্যাকগ্রাউন্ড একবারই আঁকা হয় (প্রতি ফ্রেমে নয়) → ফ্রেম মসৃণ
    bgCanvas = document.createElement('canvas'); bgCanvas.width = canvas.width; bgCanvas.height = canvas.height;
    const mainCtx = ctx; ctx = bgCanvas.getContext('2d');
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
    ctx.setTransform(k, 0, 0, k, ox, oy);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();

  // ব্যাকগ্রাউন্ড
  const bg = ctx.createLinearGradient(0, 0, 0, VH);
  bg.addColorStop(0, '#1b060b'); bg.addColorStop(0.5, '#0b0305'); bg.addColorStop(1, '#070203');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VW, VH);
  const rg = ctx.createRadialGradient(CX, CY, 50, CX, CY, RR * 1.4);
  rg.addColorStop(0, 'rgba(180,20,40,0.13)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, 0, VW, VH);

  // লাল ফ্রেম
  ctx.save();
  ctx.strokeStyle = '#e3182d'; ctx.lineWidth = 5; ctx.shadowColor = '#ff2d45'; ctx.shadowBlur = 18;
  rr(18, 18, VW - 36, VH - 36, 44); ctx.stroke();
  ctx.restore();

    ctx.restore();
    ctx = mainCtx; bgDirty = false;
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(bgCanvas, 0, 0);
  ctx.setTransform(k, 0, 0, k, ox, oy);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
  const realRing = ringAngle;
  ringAngle = prevRing + (ringAngle - prevRing) * renderAlpha;   // রিংও মাঝের অবস্থানে আঁকি

  // শিরোনাম লাইন: ROUND n  ⏱ mm:ss · QUALIFYING
  {
    const a = finalMode ? 'FINAL ROUND' : 'ROUND ' + roundNo + ' / ' + CONFIG.finalists;
    const bt = countdown() + '  ·  ' + (finalMode ? 'FINAL' : 'QUALIFYING');
    ctx.font = 'bold 30px ' + FONT;
    const wa = ctx.measureText(a).width, wb = ctx.measureText(bt).width, gap = 18, ic = 28;
    let x = CX - (wa + gap + ic + 8 + wb) / 2;
    txt(a, x, 70, 30, '#ff3b4e', 'left'); x += wa + gap;
    clockIcon(x + ic / 2, 70, 11, '#ff3b4e'); x += ic + 8;
    txt(bt, x, 70, 30, '#ff3b4e', 'left');
  }

  // "QUALIFIED FOR FINAL" প্যানেল
  {
    const px = 50, py = 104, pw = 980, ph = 330;
    rr(px, py, pw, ph, 22); ctx.fillStyle = 'rgba(120,12,28,0.28)'; ctx.fill();
    ctx.strokeStyle = 'rgba(227,24,45,0.75)'; ctx.lineWidth = 3; ctx.stroke();
    txt((finalMode ? 'FINALISTS' : 'QUALIFIED FOR FINAL') + (CONFIG.finalists > 10 ? (finalMode ? '   -   ' + balls.length + ' LEFT' : '   -   ' + qualified.length + ' / ' + CONFIG.finalists) : ''), CX, py + 38, 34, '#ffffff');
    const pages = Math.max(1, Math.ceil((finalMode ? CONFIG.finalists : qualified.length) / 5));   // শুধু ভরা পৃষ্ঠাগুলো ঘোরে
    const page = Math.floor(clock / 4) % pages;
    for (let i = 0; i < 5; i++) {
      const idx = page * 5 + i;
      if (idx >= CONFIG.finalists) continue;
      const y = py + 80 + i * 50;
      rr(px + 22, y - 22, pw - 44, 44, 10); ctx.fillStyle = i % 2 ? 'rgba(255,255,255,0.03)' : 'rgba(255,60,80,0.07)'; ctx.fill();
      txt('#' + (idx + 1), px + 52, y, 26, '#ff4d5e', 'left');
      const code = qualified[idx];
      if (code) {
        const nm = CONFIG.showNames ? countryName(code) : '';
        ctx.font = 'bold 28px ' + FONT;
        const nw = nm ? ctx.measureText(nm).width : 0, fw = 40, g2 = nm ? 14 : 0;
        let x = CX - (fw + g2 + nw) / 2;
        drawFlagH(code, x + fw / 2, y, 28, 40); x += fw + g2;
        if (nm) txt(nm, x, y, 28, '#ffffff', 'left');
        txt('✓ QUALIFIED', px + pw - 52, y, 20, '#35e07a', 'right');
      } else {
        txt('—', CX, y, 28, 'rgba(255,255,255,0.22)');
      }
    }
  }

  // বাঁ লেবেল + মাঝের স্ট্যাটাস
  txt(CONFIG.modLabel, 62, 458, 20, 'rgba(255,90,100,0.55)', 'left', 'normal');
  txt((finalMode ? 'FINAL' : 'QUALIFYING') + '  ·  ' + countdown(), CX, 458, 26, 'rgba(255,90,100,0.6)');

  // arena ভেতরের আভা
  ctx.beginPath(); ctx.arc(CX, CY, RR, 0, 7);
  const ig = ctx.createRadialGradient(CX, CY, RR * 0.1, CX, CY, RR);
  ig.addColorStop(0, 'rgba(255,255,255,0.025)'); ig.addColorStop(1, 'rgba(255,40,60,0.07)');
  ctx.fillStyle = ig; ctx.fill();

  // রিং: সাদা অংশ + হলুদ ফাঁক-চিহ্ন
  {
    ctx.save();
    ctx.lineWidth = 6; ctx.strokeStyle = '#ffffff'; ctx.shadowColor = 'rgba(255,255,255,0.7)'; ctx.shadowBlur = 14;
    const SEG = 720, da = Math.PI * 2 / SEG;
    ctx.beginPath();
    let run = false, runStart = 0;
    for (let i = 0; i <= SEG; i++) {
      const a0 = i * da, mid = a0 + da / 2;
      const solid = i < SEG && !inGap(mid, 0);
      if (solid && !run) { run = true; runStart = a0; ctx.moveTo(CX + Math.cos(a0) * RR, CY + Math.sin(a0) * RR); }
      if (!solid && run) { run = false; ctx.arc(CX, CY, RR, runStart, a0); }
    }
    ctx.stroke();
    ctx.restore();
    ctx.save();
    ctx.lineWidth = 11; ctx.lineCap = 'round'; ctx.strokeStyle = '#ffd21a';
    ctx.shadowColor = '#ffb000'; ctx.shadowBlur = 26;
    for (const g of gaps) {           // ফাঁকের মাঝখান খালি; শুধু দুই কিনারা হলুদ জ্বলে
      const w = gapWidth(g); if (w <= 0) continue;
      const a0 = ringAngle + g.c - w / 2, a1 = ringAngle + g.c + w / 2, cap = Math.min(0.09, w / 2);
      ctx.beginPath(); ctx.arc(CX, CY, RR, a0 - cap * 0.0, a0 + cap); ctx.stroke();
      ctx.beginPath(); ctx.arc(CX, CY, RR, a1 - cap, a1); ctx.stroke();
    }
    ctx.restore();
  }

  // arena-র পতাকা
  for (const b of balls) {
    const bx = b.px + (b.x - b.px) * renderAlpha, by = b.py + (b.y - b.py) * renderAlpha;
    drawFlag(b.code, CX + bx * S, CY + by * S, b.r * S * 2.0, 1, 0, 0);
  }
  if (phase === 'intro') {
    ctx.beginPath(); ctx.arc(CX, CY, RR - 4, 0, 7); ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill();
    const kin = Math.min(1, preT / 0.35);
    txt(finalMode ? 'FINAL ROUND' : 'ROUND ' + roundNo + ' / ' + CONFIG.finalists, CX, CY - 190, (finalMode ? 92 : 78) * (0.8 + 0.2 * kin), '#ffd21a', 'center', 'bold', true);
    if (preT >= 1.8) txt('GET READY', CX, CY - 70, 60, '#ffffff', 'center', 'bold', true);
    if (preT >= 3) {
      const n = 3 - Math.floor(preT - 3), f = (preT - 3) % 1;
      txt(String(Math.max(1, n)), CX, CY + 100, 230 * (1 + 0.35 * (1 - f) * (1 - f)), '#ff3b4e', 'center', 'bold', true);
    }
  } else if (phase === 'play' && t < 0.9) {
    ctx.save(); ctx.globalAlpha = Math.max(0, 1 - t / 0.9);
    txt('GO!', CX, CY, 150 * (1 + t * 0.4), '#35e07a', 'center', 'bold', true);
    ctx.restore();
  } else if (phase === 'play') {
    const openIn = CONFIG.holesStartSec - t;
    if (openIn > 0) txt('HOLES OPEN IN ' + Math.ceil(openIn), CX, CY - RR * 0.55, 34, '#ffd21a', 'center', 'bold', true);
  }

  // বাকি পতাকার সংখ্যা + লাল বার
  {
    const remaining = balls.length;
    const bw = 640, bx = CX - bw / 2, by = 1494;
    rr(bx, by, bw, 12, 6); ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.fill();
    const frac = total ? Math.max(0, Math.min(1, remaining / total)) : 0;
    if (frac > 0) { rr(bx, by, Math.max(12, bw * frac), 12, 6); ctx.fillStyle = '#e3182d'; ctx.shadowColor = '#ff2d45'; ctx.shadowBlur = 12; ctx.fill(); ctx.shadowBlur = 0; }
    txt(remaining + ' / ' + total + ' FLAGS', CX, 1534, 30, '#ffffff');
  }

  // নিচে বাদ-পড়া পতাকার সারি (নিচ থেকে ওপরে, বাঁ থেকে ডানে)
  {
    const cell = GRID_W / GRID_COLS, fh = 22, pitch = 27;
    elim.forEach((e, i) => {
      const row = Math.floor(i / GRID_COLS), col = i % GRID_COLS;
      const tx = GRID_LEFT + col * cell + cell / 2, ty = GRID_BOTTOM - row * pitch - pitch / 2;
      const p = Math.min(1, (clock - e.t0) / e.dur);
      if (p >= 1) { drawFlagH(e.code, tx, ty, fh, cell * 0.9); return; }
      const ease = p * p * (3 - 2 * p), sd = 0.55 * p + 0.45 * ease;
      const pos = pathAt(e.path, sd * e.path.L), x = pos[0], y = pos[1];
      const wBase = e.w0 + (cell * 0.9 - e.w0) * ease;
      drawFlag(e.code, x, y, wBase, 1, e.rot * (1 - p), 4);
    });
  }

  // চ্যানেলের পিল
  {
    ctx.font = 'bold 30px ' + FONT;
    const label = '★ ' + CONFIG.channel + ' ★';
    const w = Math.max(420, ctx.measureText(label).width + 80);
    ctx.save();
    rr(CX - w / 2, 1830, w, 58, 29); ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fill();
    ctx.strokeStyle = '#ffd21a'; ctx.lineWidth = 3; ctx.shadowColor = '#ffb000'; ctx.shadowBlur = 16; ctx.stroke();
    ctx.restore();
    txt(label, CX, 1860, 30, '#ffe76a');
  }

  // কোয়ালিফাই / চ্যাম্পিয়ন পর্দা
  if ((phase === 'qualified' || phase === 'champion') && winner) {
    const k2 = Math.min(1, overlayT / 0.5);
    ctx.fillStyle = 'rgba(4,1,2,' + (0.78 * k2) + ')'; ctx.fillRect(0, 0, VW, VH);
    const champ = phase === 'champion';
    const fw = (champ ? 640 : 560) * (0.7 + 0.3 * k2);
    txt(champ ? 'CHAMPION' : 'QUALIFIED!', CX, 560, champ ? 96 : 84, '#ffd21a', 'center', 'bold', true);
    drawFlag(winner, CX, 960, fw, k2, 0, 30);
    txt(countryName(winner), CX, 1190, 70, '#ffffff', 'center', 'bold', true);
    if (champ) {
      txt('Wins: ' + (wins[winner] || 1), CX, 1270, 36, '#ffb3ba', 'center', 'normal');
      txt('Next tournament in ' + Math.max(0, Math.ceil(CONFIG.championShowSec - overlayT)), CX, 1700, 30, 'rgba(255,255,255,0.6)', 'center', 'normal');
    } else {
      txt(qualified.length + ' / ' + CONFIG.finalists + ' QUALIFIED FOR FINAL', CX, 1270, 38, '#35e07a', 'center', 'bold');
    }
  }
  if (!AC || AC.state !== 'running') txt('TAP SCREEN TO ENABLE SOUND', CX, 1522, 26, 'rgba(255,210,26,' + (0.55 + 0.35 * Math.sin(clock * 4)) + ')', 'center', 'bold');
  ctx.restore();
  ringAngle = realRing;
}

/* ---------- মূল লুপ ---------- */
let last = performance.now(), lastTry = 0;
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (AC && AC.state === 'suspended' && now - lastTry > 700) { lastTry = now; try { AC.resume(); } catch (e) {} }   // অনুমতি থাকলে নিজে নিজেই সাউন্ড চালু
  update(dt); draw();
  requestAnimationFrame(frame);
}
startRound();
requestAnimationFrame(frame);

/* কী-বোর্ড: M = সাউন্ড অন/অফ, R = রাউন্ড আবার, T = নতুন টুর্নামেন্ট, F = ফুলস্ক্রিন */
window.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') { roundNo--; startRound(); }
  if (e.key === 't' || e.key === 'T') { qualified = []; roundNo = 0; startRound(); }
  if (e.key === 'm' || e.key === 'M') { muted = !muted; }
  if (e.key === 'f' || e.key === 'F') { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
});
</script>
